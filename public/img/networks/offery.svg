<?xml version="1.0" encoding="UTF-8"?>
<!--
  Offery ships no logo file — their mark is a CSS wordmark on offery.io
  (`<span class="logo-offer">Offer</span><span class="logo-y">y</span>`), so this
  reproduces it from their own stylesheet rather than inventing one: Inter 900,
  -0.02em tracking, "Offer" in their `--logo-gradient` (135° --teal #12e0cb →
  --mint #45ffc8) and the "y" in white. The dark plate is their `--bg-dark`
  (#0a0f1e), which is where the white glyph is legible — on a light admin table
  it would otherwise be an invisible letter.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 72" role="img" aria-label="Offery">
  <defs>
    <linearGradient id="offery-logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12e0cb"/>
      <stop offset="1" stop-color="#45ffc8"/>
    </linearGradient>
  </defs>
  <rect width="240" height="72" rx="14" fill="#0a0f1e"/>
  <text x="120" y="47" text-anchor="middle"
        font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="34" font-weight="900" letter-spacing="-0.68">
    <tspan fill="url(#offery-logo)">Offer</tspan><tspan fill="#ffffff">y</tspan>
  </text>
</svg>
