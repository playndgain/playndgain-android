<?xml version="1.0" encoding="UTF-8"?>
<!--
  Skylup ships no publisher logo file  skylup.co is a CSS wordmark on a
  dark plate  so this follows the Offery treatment: the name, Inter 800,
  on their navy (#0b1220) with a sky-blue accent so it stays legible on
  the light admin table.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 72" role="img" aria-label="Skylup">
  <rect width="240" height="72" rx="14" fill="#0b1220"/>
  <circle cx="28" cy="36" r="10" fill="#5b8cff"/>
  <text x="148" y="47" text-anchor="middle"
        font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="32" font-weight="800" letter-spacing="-0.6" fill="#ffffff">Skylup</text>
</svg>
