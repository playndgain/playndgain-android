; PLAYNDGAIN — PHP-FPM pool.

[www]
user = www-data
group = www-data

; TCP on the loopback rather than a unix socket: nginx is in this container and
; the upstream in docker/nginx/nginx.conf points here.
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; NOT OPTIONAL, and the single most common way a containerised Laravel comes up
; with no configuration at all. php-fpm clears the worker environment by
; default, so every variable Dokploy injects — APP_KEY, DB_PASSWORD, REDIS_HOST
; — would be gone by the time PHP read it. The application would boot against
; config defaults and fail in ways that read like a database problem.
;
; The entrypoint runs `config:cache`, which freezes the values into
; bootstrap/cache/config.php before any worker starts, so this is belt and
; braces — but the braces are what hold when someone clears that cache to debug
; something at 3am.
clear_env = no

; Worker output reaches the container log instead of being swallowed.
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

php_admin_flag[log_errors] = on
php_admin_value[error_log] = /dev/stderr

; Horizon is a separate container and the scheduler another, so nothing long
; running lands on this pool. A request that needs more than two minutes is a
; job that was never queued.
request_terminate_timeout = 120
