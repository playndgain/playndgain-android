; PLAYNDGAIN — PHP runtime settings, loaded last (zz-) so these win.

memory_limit = 512M
expose_php = Off

; Panels upload logos and CSVs and generate credit-note PDFs; the wall uploads
; nothing. The nginx blocks cap the request body far lower on the API domain.
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 120

; Container logs. Dokploy reads stdout/stderr; a file under /var/log would be
; invisible from the panel and would grow until the disk alert fired.
log_errors = On
error_log = /dev/stderr
display_errors = Off

; The image is immutable, so opcache never needs to stat a file for changes.
; The entrypoint writes every generated PHP file — config, routes, views,
; Filament components — before php-fpm starts, so nothing this caches is
; written afterwards.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

realpath_cache_size = 4096k
realpath_cache_ttl = 600
