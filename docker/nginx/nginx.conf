# Container nginx — the http context.
#
# The stock Alpine nginx.conf is replaced wholesale rather than appended to, so
# what this server does is stated in one file instead of being the sum of a
# distribution default and three drop-ins.
#
# Per-domain policy lives in the server blocks (conf.d/*.conf, rendered from
# /etc/nginx/templates by the entrypoint). This file holds only what nginx
# accepts in the `http` context and nothing that decides behaviour for one
# domain.

user  www-data;
worker_processes  auto;

error_log  /dev/stderr  warn;
pid        /run/nginx/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # $remote_addr, not $http_x_forwarded_for: after the real_ip block below,
    # $remote_addr IS the client, and logging the raw header instead would log
    # whatever a caller chose to send.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';

    access_log  /dev/stdout  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # Panels upload logos and CSVs; postbacks are capped far lower in their own
    # block (deploy/nginx/api.playndgain.com.conf keeps 128k).
    client_max_body_size  32m;

    # -----------------------------------------------------------------------
    # Real client IP — LOAD-BEARING.
    # -----------------------------------------------------------------------
    #
    # Every request reaches this container from Traefik on the Docker network,
    # so without this block $remote_addr is the proxy's container IP for every
    # visitor on earth. Two things break at once, and both break quietly:
    #
    #   * `limit_req zone=wall` keys on $binary_remote_addr. One key for all
    #     traffic means the wall's 60r/m budget is spent by the first busy
    #     second and every publisher's iframe starts answering 429.
    #   * the fraud engine places clicks by IP. One address for everyone is a
    #     datacenter rule that fires on all of them or none.
    #
    # Laravel's own view of the client is already correct — bootstrap/app.php
    # sets trustProxies(at: '*') and TrustCloudflare runs before anything reads
    # $request->ip(). That fixes PHP and cannot fix nginx; this is nginx's half.
    #
    # The ranges are the private ones Docker allocates bridge and overlay
    # networks from. `real_ip_recursive on` then walks X-Forwarded-For from the
    # right and stops at the first address that is not one of ours, which is
    # the client even when Traefik sits behind Cloudflare.
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    set_real_ip_from  127.0.0.0/8;
    set_real_ip_from  fd00::/8;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # PHP-FPM over TCP on the loopback, not the unix socket the VPS configs
    # use: both processes are in this container, and a socket path would be one
    # more thing to keep in step between two files.
    upstream php-fpm {
        server 127.0.0.1:9000;
    }

    # Rate-limit zones (playndgain-limit-zones.conf, copied from deploy/) and
    # the rendered server blocks. `limit_req_zone` is only legal here, which is
    # why that file is a separate include rather than part of a server block.
    include /etc/nginx/conf.d/*.conf;
}
