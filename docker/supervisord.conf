; PLAYNDGAIN — the `app` role only: nginx in front of PHP-FPM, both in the
; foreground, both logging to the container's stdout.
;
; Horizon and the scheduler are their own containers with their own restart
; policies (docker-compose.yml). They are not programs here — a worker that
; shares a supervisor with the web server is a worker that gets restarted every
; time the web server is redeployed, and docs/11 §3 wants the opposite: an
; hour of grace so in-flight postbacks land.

[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid

[program:php-fpm]
command = php-fpm --nodaemonize --force-stderr
autostart = true
autorestart = true
startsecs = 3
priority = 5
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = nginx -g "daemon off;"
autostart = true
autorestart = true
startsecs = 3
priority = 10
; QUIT, not TERM: nginx finishes the requests it already accepted instead of
; cutting them off mid-response when the container is asked to stop.
stopsignal = QUIT
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; If either process dies for good the container must die with it, so Docker
; restarts it and Dokploy's health check reports the outage. A supervisor
; sitting alive over a dead nginx is a container that passes "running" and
; serves nothing.
[eventlistener:processes]
command = sh -c "printf 'READY\n'; while read -r line; do echo \"exiting: $line\" >&2; kill -SIGQUIT $PPID; done < /dev/stdin"
events = PROCESS_STATE_STOPPED,PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
