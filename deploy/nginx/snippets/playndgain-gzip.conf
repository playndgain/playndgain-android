# Compression — /etc/nginx/snippets/playndgain-gzip.conf
#
# docs/09 §8 states the CSS and JavaScript budgets as gzipped transfer sizes,
# and lighthouserc.json enforces them as such. Ubuntu's stock nginx.conf turns
# gzip on for text/html only, so without this file the stylesheet would cross
# the wire uncompressed and the budget would be a fiction nobody measured.
# Included by the site and wall server blocks; .github/lighthouse/serve.sh
# includes this same file so CI measures the bytes production sends.
#
# Fonts are absent from the list on purpose: woff2 is already compressed, and
# gzip would spend CPU to add a few bytes.

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml;
