# Panel/site security headers — /etc/nginx/snippets/playndgain-security-headers.conf
#
# docs/11 §10: `X-Frame-Options` cleared on `wall.` ONLY, SAMEORIGIN everywhere
# else; HSTS on the panels, not on the wall. This file is the "everywhere else"
# half. The wall server block deliberately does not include it — see
# wall.playndgain.com.conf, and tests/Feature/Security/SecurityChecklistTest.php,
# which asserts exactly that asymmetry against these files.
#
# It is a snippet rather than four copied lines because of nginx's `add_header`
# inheritance rule: a block that declares its own `add_header` throws away every
# header inherited from its parent. The static-asset locations set
# `Cache-Control`, so without re-including this they would serve unprotected
# responses. Include this file in EVERY block that sets an `add_header`.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Takes effect once certbot has added the 443 listener; harmless before that
# because browsers ignore HSTS delivered over plaintext HTTP.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# A strict CSP belongs here and is deliberately NOT enabled yet: Filament's
# Livewire/Alpine layer evaluates expressions with `new Function`, so any policy
# without 'unsafe-eval' white-screens both panels. Enable it only after loading
# every panel page with the browser console open.
#
# add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'self'" always;
