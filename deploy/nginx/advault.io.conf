# advault.io — marketing site, /docs, and both Filament panels.
# docs/11-infrastructure.md §2. Copy to /etc/nginx/sites-available/ and symlink.
#
# Every route here is served by PHP. nginx never proxies to a JavaScript
# runtime because there is no JavaScript runtime — Node exists on this box only
# to run `npm run build` at deploy time.
#
# Per-host: server_name, root, and the PHP-FPM socket version.
# TLS: run `certbot --nginx -d advault.io -d wall.advault.io -d api.advault.io`
# once, which rewrites the `listen` lines here to add 443 and drops in a 80→443
# redirect. One certificate covers all three names.

server {
    listen 80;
    listen [::]:80;

    server_name advault.io;
    root /var/www/advault/public;
    index index.php;

    charset utf-8;

    # The panels move money; the wall does not. A slow admin export is not worth
    # a 504, and nothing on this domain is a hot path.
    client_max_body_size 8m;
    fastcgi_read_timeout 120s;

    include /etc/nginx/snippets/advault-security-headers.conf;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }

    # Vite build output — hashed filenames, safe to cache forever.
    #
    # The security-headers include is repeated in this block and the next one on
    # purpose: declaring `add_header` in a location discards every header
    # inherited from the server block. Without the repeat, /build/ would be the
    # one part of the panel domain served with no X-Frame-Options at all.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/advault-security-headers.conf;
    }

    location ~* \.(woff2|avif|webp|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/advault-security-headers.conf;
    }

    # NOT IN THE DOC. `root` points at public/, so storage/ and bootstrap/cache/
    # are already unreachable by path — but a stray dotfile under public/ (an
    # editor backup, a copied .env) would be served as plaintext. Two lines to
    # close a hole that only ever opens by accident.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/advault.access.log;
    error_log /var/log/nginx/advault.error.log;
}
