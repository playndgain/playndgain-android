# wall.advault.io — the offerwall, and nothing else.
# docs/11-infrastructure.md §2.
#
# THE HEADER RULE ON THIS DOMAIN IS LOAD-BEARING. The wall is an iframe on
# arbitrary publisher domains. `X-Frame-Options: DENY` or a `frame-ancestors`
# policy applied here breaks every integration we have, at once, silently — the
# publisher sees a blank frame and we see a normal 200 in the access log. That
# is why this file does NOT include advault-security-headers.conf, why the
# header is cleared explicitly rather than merely left unset, and why
# tests/Feature/Security/SecurityChecklistTest.php asserts both.
#
# No HSTS here either (docs/11 §10: panels only). HSTS on this name would be
# inherited by every publisher's embed context and is not ours to set.
#
# Per-host: server_name, root, PHP-FPM socket. TLS via the shared certificate —
# see advault.io.conf.

server {
    listen 80;
    listen [::]:80;

    server_name wall.advault.io;
    root /var/www/advault/public;
    index index.php;

    charset utf-8;

    # Zone declared in conf.d/advault-limit-zones.conf — `limit_req_zone` is not
    # legal in a server block, whatever §2 shows. Burst 20 with `nodelay` so a
    # wall that fires its icon requests in parallel is not throttled for looking
    # like exactly what it is.
    limit_req zone=wall burst=20 nodelay;
    limit_req_status 429;

    add_header X-Frame-Options "" always;
    add_header Content-Security-Policy "frame-ancestors *;" always;

    location / {
        try_files $uri /index.php?$query_string;
    }

    # NOT IN THE DOC, and without it this block serves nothing: §2's wall server
    # has no PHP location, so `try_files` would hand /index.php back to the
    # static file handler and the browser would download the source.
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;

        # NOT IN THE DOC, and the line that makes the promise above true.
        # `add_header X-Frame-Options ""` only stops *nginx* adding the header —
        # it cannot remove one PHP emitted. If a hardening middleware ever lands
        # in the application, this drops it on the way out for this domain only.
        # tests/Feature/Security/SecurityChecklistTest.php asserts the app side
        # of the same guarantee, so both halves have to fail before an embed
        # breaks.
        fastcgi_hide_header X-Frame-Options;

        # The clearing headers are repeated for the same reason they are
        # repeated in advault.io.conf: `add_header` in a location discards the
        # inherited set. Dropping them here would un-embed every wall render,
        # which is the only response on this domain that matters.
        add_header X-Frame-Options "" always;
        add_header Content-Security-Policy "frame-ancestors *;" always;
    }

    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(woff2|avif|webp|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Separate log files: wall traffic is the volume, and mixing it into the
    # main access log makes both useless for the question you are actually
    # asking. This is the "different logging" §2 splits the domain for.
    access_log /var/log/nginx/wall.access.log;
    error_log /var/log/nginx/wall.error.log;
}
