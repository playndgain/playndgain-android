# Rate limit zones — /etc/nginx/conf.d/advault-limit-zones.conf
#
# DEVIATION FROM docs/11 §2: the doc puts `limit_req_zone` inside the wall
# server block. nginx only accepts that directive in the `http` context, so a
# faithful copy fails `nginx -t` and the machine has no web server. The zones
# live here — `conf.d/*.conf` is included from `http` by the stock Ubuntu
# nginx.conf — and the `limit_req` that uses them stays in the server block,
# which is where per-domain policy belongs.
#
# $binary_remote_addr, not $remote_addr: 4 bytes per IPv4 client instead of up
# to 15, which is the difference between 20m holding ~320k clients and ~160k.
#
# The rate is the doc's: 60 requests per minute per IP on the wall. It is the
# same number as the `wall` limiter in AppServiceProvider, deliberately — nginx
# sheds the flood before PHP boots, Laravel's limiter records the ones that get
# through as fraud signals. Two layers, one budget.

limit_req_zone $binary_remote_addr zone=wall:20m rate=60r/m;

# Postbacks come from a handful of network egress IPs and arrive in bursts after
# an outage clears. The limit is per-IP and generous on purpose: throttling a
# network's retry storm means dropping conversions we are owed money for.
#
# NOT IN THE DOC — §2 gives no zone for `api.`, only the note that the two
# domains are split so they can have different limits. This is that difference,
# made concrete. Raise it before you drop a conversion.
limit_req_zone $binary_remote_addr zone=api:10m rate=600r/m;
