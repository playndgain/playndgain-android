# api.advault.io — inbound network postbacks, and nothing else.
#
# NOT IN THE DOC. docs/11 §2 lists this domain in the table and gives the server
# blocks for the other two, so this file is written from the table row ("Postback
# endpoints only") plus §2's stated reason for the split: "they need different
# rate limits and logging". Both differences are made concrete below.
#
# Per-host: server_name, root, PHP-FPM socket. TLS via the shared certificate —
# see advault.io.conf.

server {
    listen 80;
    listen [::]:80;

    server_name api.advault.io;
    root /var/www/advault/public;
    index index.php;

    # Zone in conf.d/advault-limit-zones.conf. Deliberately far looser than the
    # wall: a network clearing its retry backlog after an outage is a legitimate
    # burst of conversions we are owed money for, and shedding it costs real
    # revenue. `nodelay` because a queued postback is a postback the network
    # times out and retries anyway.
    limit_req zone=api burst=200 nodelay;
    limit_req_status 429;

    # Postbacks are query strings and small form posts. Anything larger is not
    # a postback.
    client_max_body_size 128k;

    include /etc/nginx/snippets/advault-security-headers.conf;

    # This domain exposes exactly one route. Everything else is a 404 before it
    # reaches PHP — the panels and the wall are not reachable through this name
    # even if a future route file starts answering on it.
    location / {
        return 404;
    }

    location ^~ /postback/ {
        try_files $uri /index.php?$query_string;
    }

    # Laravel's built-in health endpoint, so an external HTTP check can watch
    # this domain without going through a money route (docs/11 §7 — external
    # checks are what report that the app is down).
    location = /up {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include /etc/nginx/snippets/advault-security-headers.conf;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Its own log, because "did that network actually send us the conversion"
    # is a question answered by grepping this file, and it should not be
    # interleaved with a million wall renders.
    access_log /var/log/nginx/api.access.log;
    error_log /var/log/nginx/api.error.log;
}
