# playndgain.com — marketing site, /docs, and both Filament panels.
# docs/11-infrastructure.md §2. Copy to /etc/nginx/sites-available/ and symlink.
#
# Every route here is served by PHP. nginx never proxies to a JavaScript
# runtime because there is no JavaScript runtime — Node exists on this box only
# to run `npm run build` at deploy time.
#
# Per-host: server_name, root, and the PHP-FPM socket version.
# TLS: run `certbot --nginx -d playndgain.com -d wall.playndgain.com -d api.playndgain.com`
# once, which rewrites the `listen` lines here to add 443 and drops in a 80→443
# redirect. One certificate covers all three names.

server {
    listen 80;
    listen [::]:80;

    server_name playndgain.com;
    root /var/www/playndgain/public;
    index index.php;

    charset utf-8;

    # The panels move money; the wall does not. A slow admin export is not worth
    # a 504, and nothing on this domain is a hot path.
    client_max_body_size 8m;
    fastcgi_read_timeout 120s;

    include /etc/nginx/snippets/playndgain-security-headers.conf;

    # docs/09 §8 states its byte budgets as gzipped transfer sizes; this is
    # where that becomes true. Ubuntu's nginx.conf compresses text/html only.
    include /etc/nginx/snippets/playndgain-gzip.conf;

    # The wall lives on its own host. An embed pointed at this one would get
    # SAMEORIGIN and render "refused to connect"; send it to the wall host
    # instead. 308 keeps the consent POST a POST.
    location ~ ^/wall(/|$) {
        return 308 https://wall.playndgain.com$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }

    # Vite build output — hashed filenames, safe to cache forever.
    #
    # The security-headers include is repeated in this block and the next one on
    # purpose: declaring `add_header` in a location discards every header
    # inherited from the server block. Without the repeat, /build/ would be the
    # one part of the panel domain served with no X-Frame-Options at all.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/playndgain-security-headers.conf;
    }

    location ~* \.(woff2|avif|webp|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Sent-mail HTML is previewed in a srcdoc iframe (origin null).
        # @font-face against this host is a cross-origin fetch; without
        # ACAO the browser drops Sora and the preview falls back to system.
        add_header Access-Control-Allow-Origin "*" always;
        include /etc/nginx/snippets/playndgain-security-headers.conf;
    }

    # NOT IN THE DOC. `root` points at public/, so storage/ and bootstrap/cache/
    # are already unreachable by path — but a stray dotfile under public/ (an
    # editor backup, a copied .env) would be served as plaintext. Two lines to
    # close a hole that only ever opens by accident.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/playndgain.access.log;
    error_log /var/log/nginx/playndgain.error.log;
}
