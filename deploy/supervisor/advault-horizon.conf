; Horizon — /etc/supervisor/conf.d/advault-horizon.conf
; docs/11-infrastructure.md §3.
;
; One process. Horizon supervises its own worker pools from config/horizon.php
; (postbacks / default / sync, separate pools so a ten-minute catalogue sync
; never sits in front of a conversion postback) — supervisor's only job is to
; keep the Horizon master alive.
;
; After editing:  supervisorctl reread && supervisorctl update
;
; Per-host: the path, and the PHP binary if it is not on PATH for www-data.

[program:advault-horizon]
process_name=%(program_name)s
command=php /var/www/advault/artisan horizon
directory=/var/www/advault
autostart=true
autorestart=true
user=www-data

; The line that matters. On deploy, `php artisan horizon:terminate` asks Horizon
; to finish what it is holding and exit; supervisor then restarts it with the
; new code. An hour of grace means an in-flight outgoing postback completes
; instead of being killed mid-request and retried against a publisher who may
; have already credited the user.
stopwaitsecs=3600

; SIGTERM to the master only. Horizon drains its own workers; a group signal
; would kill them mid-job, which is exactly what stopwaitsecs exists to avoid.
stopsignal=TERM
stopasgroup=false
killasgroup=false

; NOT IN THE DOC, one line each. Without them Horizon's stdout goes to a
; supervisor-generated path nobody can guess at 3am, and the log grows until the
; disk-usage alert in docs/11 §7 fires.
redirect_stderr=true
stdout_logfile=/var/log/supervisor/advault-horizon.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
